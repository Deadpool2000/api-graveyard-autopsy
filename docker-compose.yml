services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aga-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_ALT_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - aga-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aga-frontend
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aga-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aga-backend
    env_file:
      - .env
    environment:
      - ENV_FILE_PATH=/app/.env
      - SQLITE_DB_PATH=/app/data/autopsy_history.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_ENABLED=${GEMINI_ENABLED:-true}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-15}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-1024}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-5}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:8088}
      - SAMPLE_DATA_DIR=/app/sample-data
    volumes:
      - ./sample-data:/app/sample-data:ro
      - ./.env:/app/.env:ro
      - aga-sqlite-data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      aga-network:
        aliases:
          - api
          - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aga-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      - ENV_FILE_PATH=/app/.env
      - SQLITE_DB_PATH=/app/data/autopsy_history.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_ENABLED=${GEMINI_ENABLED:-true}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-15}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-1024}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-5}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:8088}
      - SAMPLE_DATA_DIR=/app/sample-data
    volumes:
      - ./sample-data:/app/sample-data:ro
      - ./.env:/app/.env:ro
      - aga-sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aga-network
    restart: unless-stopped

  target-api:
    build:
      context: ./target-api
      dockerfile: Dockerfile
    container_name: aga-target-api
    ports:
      - "${TARGET_API_PORT:-8090}:8090"
    networks:
      aga-network:
        aliases:
          - target-api
          - zombie-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aga-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - aga-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  aga-network:
    driver: bridge

volumes:
  aga-sqlite-data:
