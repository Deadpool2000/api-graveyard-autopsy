services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aga-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_ALT_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - aga-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aga-frontend
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aga-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aga-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SAMPLE_DATA_DIR=/app/sample-data
      - ENV_FILE_PATH=/app/.env
    volumes:
      - ./sample-data:/app/sample-data:ro
      - ./.env:/app/.env:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      aga-network:
        aliases:
          - api
          - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aga-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SAMPLE_DATA_DIR=/app/sample-data
      - ENV_FILE_PATH=/app/.env
    volumes:
      - ./sample-data:/app/sample-data:ro
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aga-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aga-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - aga-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  aga-network:
    driver: bridge

